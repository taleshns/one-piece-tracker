<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .ep-canonical { background-color: #1f2937; border-color: #4b5563; color: #f3f4f6; }
        .ep-filler { background-color: #eab308; border-color: #ca8a04; color: #111827; }
        .ep-checkbox:checked + label, .movie-checkbox:checked + label { background-color: #ef4444 !important; color: white !important; border-color: #dc2626 !important; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans pb-20">

    <!-- Vídeo de Introdução -->
    <div id="intro-video-container" class="fixed inset-0 z-50 bg-black flex items-center justify-center">
        <video id="intro-video" class="w-full h-full object-cover" autoplay playsinline muted>
            <source src="abertura.mp4" type="video/mp4">
        </video>
        <button onclick="fecharIntro()" class="absolute top-6 right-6 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-bold z-50 transition">Pular Intro</button>
    </div>

    <!-- Pop-up de Celebração -->
    <div id="celebration-popup" class="fixed inset-0 z-40 bg-black/90 hidden flex-col items-center justify-center transition-opacity duration-500 opacity-0">
        <img id="celeb-img" src="" class="w-64 h-32 object-cover rounded-lg border-4 border-yellow-500 mb-4 shadow-[0_0_20px_rgba(234,179,8,0.5)]">
        <h2 class="text-4xl font-black text-yellow-400 uppercase tracking-widest text-center">Saga Concluída!</h2>
        <p id="celeb-text" class="text-xl text-gray-300 mt-2 mb-6"></p>
        <button onclick="fecharCelebracao()" class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 px-8 py-3 rounded-full font-bold text-lg transition">Avançar</button>
    </div>

    <!-- Header & Menu Hambúrguer -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-30 shadow-lg">
        <div class="max-w-5xl mx-auto p-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-red-500 tracking-wider uppercase">☠️ OP Tracker</h1>
            
            <button onclick="toggleMenu()" class="text-white focus:outline-none md:hidden">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>

            <nav class="hidden md:flex items-center gap-4">
                <button onclick="switchTab('eps')" class="text-gray-200 hover:text-red-500 font-bold transition">Episódios</button>
                <button onclick="switchTab('movies')" class="text-gray-200 hover:text-red-500 font-bold transition">Filmes</button>
                <button onclick="exportarDados()" class="text-gray-200 hover:text-red-500 font-bold transition">Exportar</button>
                <label class="text-gray-200 hover:text-red-500 font-bold cursor-pointer transition">
                    Importar <input type="file" class="hidden" accept=".json" onchange="importarDados(event)">
                </label>
                <input type="text" id="profile-name-desktop" placeholder="Nome do Pirata" class="bg-gray-700 border border-gray-600 rounded px-3 py-1 text-sm focus:outline-none focus:border-red-500" oninput="salvarPerfil(this.value)">
            </nav>
        </div>
        
        <nav id="mobile-menu" class="hidden bg-gray-800 border-t border-gray-700 md:hidden flex-col p-4 gap-4">
            <button onclick="switchTab('eps')" class="text-left text-gray-200 font-bold hover:text-red-500">Episódios</button>
            <button onclick="switchTab('movies')" class="text-left text-gray-200 font-bold hover:text-red-500">Filmes</button>
            <button onclick="exportarDados()" class="text-left text-gray-200 font-bold hover:text-red-500">Exportar Backup</button>
            <label class="text-left text-gray-200 font-bold cursor-pointer hover:text-red-500">
                Importar Backup <input type="file" class="hidden" accept=".json" onchange="importarDados(event)">
            </label>
            <input type="text" id="profile-name-mobile" placeholder="Nome do Pirata" class="bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-red-500" oninput="salvarPerfil(this.value)">
        </nav>
    </header>

    <!-- Container Principal -->
    <main class="max-w-5xl mx-auto p-4">
        
        <!-- Banner Carrossel do Topo -->
        <div class="mb-8 rounded-xl overflow-hidden shadow-lg border border-gray-700 h-48 sm:h-64 md:h-80">
            <img id="top-banner" src="" class="w-full h-full object-cover">
        </div>

        <!-- Aba de Episódios -->
        <div id="eps-view">
            <div class="flex flex-wrap gap-4 mb-6 text-sm font-bold text-gray-300">
                <div class="flex items-center gap-2"><span class="w-4 h-4 bg-gray-800 border border-gray-600 rounded inline-block"></span> Canônico</div>
                <div class="flex items-center gap-2"><span class="w-4 h-4 bg-yellow-500 border border-yellow-600 rounded inline-block"></span> Filler (Opcional)</div>
            </div>
            <div id="sagas-container"></div>
        </div>

        <!-- Aba de Filmes -->
        <div id="movies-view" class="hidden">
            <h2 class="text-3xl font-black text-red-500 uppercase tracking-wide mb-6">Filmes</h2>
            <div id="movies-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
        </div>

    </main>

    <!-- Botão Flutuante (Apenas na aba de episódios) -->
    <button id="btn-atual" onclick="irParaAtual()" class="fixed bottom-6 right-6 bg-red-600 hover:bg-red-700 text-white p-4 rounded-full shadow-lg shadow-red-900/50 font-bold z-30 transition flex items-center justify-center group">
        <span class="hidden group-hover:inline mr-2">Ep. Atual</span> ⚓
    </button>

    <script>
        // Imagens do Carrossel (Topo)
        const carouselImages = [
            "banner-generico-tripulacao.jpg",
            "banner-alianca-completa.jpg",
            "banner-novo-mundo.jpg",
            "banner-timeskip-grupo.jpg"
        ];
        
        // Sagas e Arquivos Locais
        const sagas = [
            { id: "eastblue", name: "Saga East Blue", img: "one-piece_East_Blue_01.webp", start: 1, end: 61 },
            { id: "alabasta", name: "Saga Alabasta", img: "one-piece_Alabasta.webp", start: 62, end: 143 },
            { id: "skypiea", name: "Saga Skypiea", img: "one-piece_Skypiea_01.webp", start: 144, end: 206 },
            { id: "water7", name: "Saga Water 7", img: "one-piece_Water_7_01.webp", start: 207, end: 325 },
            { id: "thrillerbark", name: "Saga Thriller Bark", img: "one-piece_Thriller_Bark_01.webp", start: 326, end: 384 },
            { id: "marineford", name: "Saga Guerra de Marineford", img: "one-piece_Marineford_01.webp", start: 385, end: 516 },
            { id: "fishman", name: "Saga Ilha dos Homens-Peixe", img: "one-piece_Ilha_dos_Tritoes.webp", start: 517, end: 574 },
            { id: "dressrosa", name: "Saga Dressrosa", img: "one-piece_Dressrosa_01.webp", start: 575, end: 746 },
            { id: "yonkou", name: "Saga Yonkou", img: "one-piece_Saga_dos_Yonkou_01.webp", start: 747, end: 1085 },
            { id: "final", name: "Saga Final", img: "one-piece_Saga_Final.webp", start: 1086, end: 1180 }
        ];

        // Mapeamento Rigoroso de Fillers
        const fillers = [
            50, 54, 55, 56, 57, 58, 59, 60, 61, 93, 98, 99, 101, 102, 131, 132, 133, 134, 135, 136, 137, 138, 139, 
            140, 141, 142, 143, 196, 197, 198, 199, 200, 201, 202, 203, 204, 205, 206, 213, 214, 215, 216, 220, 
            221, 222, 223, 224, 225, 226, 279, 280, 281, 282, 283, 291, 292, 303, 317, 318, 319, 326, 327, 328, 
            329, 330, 331, 332, 333, 334, 335, 336, 382, 383, 384, 406, 407, 426, 427, 428, 429, 457, 458, 492, 
            499, 506, 542, 575, 576, 577, 578, 590, 747, 748, 749, 750, 775, 780, 781, 782, 895, 896, 907, 1029, 1030
        ];

        // Lista de Filmes
        const movies = [
            { id: 1, title: "O Filme", year: 2000 },
            { id: 2, title: "Aventura na Ilha Neerlandesa", year: 2001 },
            { id: 3, title: "O Reino de Chopper", year: 2002 },
            { id: 4, title: "Aventura Mortal", year: 2003 },
            { id: 5, title: "A Maldição da Espada Sagrada", year: 2004 },
            { id: 6, title: "Barão Omatsuri e a Ilha Secreta", year: 2005 },
            { id: 7, title: "O Soldado Mecânico Gigante", year: 2006 },
            { id: 8, title: "Princesa do Deserto e os Piratas", year: 2007 },
            { id: 9, title: "Flor de Inverno, Milagre da Cerejeira", year: 2008 },
            { id: 10, title: "Strong World", year: 2009 },
            { id: 11, title: "A Perseguição ao Chapéu de Palha (3D)", year: 2011 },
            { id: 12, title: "Z", year: 2012 },
            { id: 13, title: "Gold", year: 2016 },
            { id: 14, title: "Stampede", year: 2019 },
            { id: 15, title: "Red", year: 2022 }
        ];

        // Banco de Dados Local
        let watchedEpisodes = JSON.parse(localStorage.getItem('opTrackerData')) || {};
        let watchedMovies = JSON.parse(localStorage.getItem('opTrackerMovies')) || {};

        // Sorteia Imagem Topo
        function sortearBanner() {
            const randomImg = carouselImages[Math.floor(Math.random() * carouselImages.length)];
            document.getElementById('top-banner').src = randomImg;
        }

        // Sistema de Vídeo
        function fecharIntro() {
            const introContainer = document.getElementById('intro-video-container');
            const introVideo = document.getElementById('intro-video');
            introVideo.pause();
            introContainer.style.opacity = '0';
            setTimeout(() => introContainer.style.display = 'none', 500);
        }
        document.getElementById('intro-video').addEventListener('ended', fecharIntro);
        document.getElementById('intro-video').addEventListener('error', fecharIntro);

        // Menu e Navegação
        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        function switchTab(tab) {
            document.getElementById('eps-view').classList.add('hidden');
            document.getElementById('movies-view').classList.add('hidden');
            document.getElementById(`${tab}-view`).classList.remove('hidden');
            
            document.getElementById('btn-atual').style.display = tab === 'eps' ? 'flex' : 'none';
            document.getElementById('mobile-menu').classList.add('hidden'); // Fecha menu no mobile
        }

        function salvarPerfil(valor) {
            localStorage.setItem('opTrackerProfile', valor);
            document.getElementById('profile-name-desktop').value = valor;
            document.getElementById('profile-name-mobile').value = valor;
        }

        // Renderizar Sagas
        function renderSagas() {
            const container = document.getElementById('sagas-container');
            container.innerHTML = '';

            sagas.forEach((saga) => {
                let epsHTML = '';
                let totalSaga = 0;
                let watchedSaga = 0;

                for (let i = saga.start; i <= saga.end; i++) {
                    totalSaga++;
                    const isChecked = watchedEpisodes[i] ? 'checked' : '';
                    if (isChecked) watchedSaga++;
                    
                    const isFiller = fillers.includes(i);
                    const colorClass = isFiller ? 'ep-filler' : 'ep-canonical';

                    epsHTML += `
                        <div class="relative">
                            <input type="checkbox" id="ep-${i}" class="ep-checkbox hidden" ${isChecked} onchange="toggleEp(${i}, '${saga.id}')">
                            <label for="ep-${i}" class="block text-center border rounded py-2 text-sm font-bold cursor-pointer transition select-none ${colorClass}">
                                ${i}
                            </label>
                        </div>
                    `;
                }

                const isCompleted = totalSaga === watchedSaga && totalSaga > 0;
                
                const sagaCard = document.createElement('div');
                sagaCard.className = 'mb-8 bg-gray-800 rounded-xl overflow-hidden shadow-md border border-gray-700';
                
                // Cabeçalho da Saga Fora da Imagem
                sagaCard.innerHTML = `
                    <div class="p-4 bg-gray-900 border-b border-gray-700 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h2 class="text-2xl font-black text-red-500 uppercase tracking-wide">${saga.name}</h2>
                            <div class="flex items-center gap-3 mt-1">
                                <span class="text-sm font-semibold bg-gray-700 px-3 py-1 rounded text-gray-200">
                                    ${watchedSaga} / ${totalSaga} EPs
                                </span>
                                ${isCompleted ? '<span class="text-yellow-400 text-sm font-bold bg-gray-700 px-3 py-1 rounded">🏆 Concluída</span>' : ''}
                            </div>
                        </div>
                        <div class="flex items-center gap-2 w-full sm:w-auto">
                            <button onclick="marcarSaga('${saga.id}')" class="flex-1 sm:flex-none bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded text-sm font-bold transition">Marcar Vista</button>
                            <button onclick="toggleSection('${saga.id}')" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded transition text-white" id="icon-${saga.id}">
                                ${isCompleted ? '▼' : '▲'}
                            </button>
                        </div>
                    </div>
                    <img src="${saga.img}" class="w-full h-40 sm:h-56 object-cover cursor-pointer" onclick="toggleSection('${saga.id}')">
                    
                    <div id="content-${saga.id}" class="${isCompleted ? 'hidden' : 'grid'} grid-cols-5 sm:grid-cols-8 md:grid-cols-10 gap-2 p-4 bg-gray-800">
                        ${epsHTML}
                    </div>
                `;
                container.appendChild(sagaCard);
            });
        }

        // Renderizar Filmes
        function renderMovies() {
            const container = document.getElementById('movies-container');
            container.innerHTML = '';

            movies.forEach(movie => {
                const isChecked = watchedMovies[movie.id] ? 'checked' : '';
                container.innerHTML += `
                    <div class="bg-gray-800 border border-gray-700 rounded-lg p-4 flex items-center justify-between shadow">
                        <div>
                            <p class="text-xs text-red-400 font-bold">FILME ${movie.id} • ${movie.year}</p>
                            <h3 class="text-lg font-bold text-gray-100 leading-tight mt-1">${movie.title}</h3>
                        </div>
                        <div class="relative ml-4">
                            <input type="checkbox" id="movie-${movie.id}" class="movie-checkbox hidden" ${isChecked} onchange="toggleMovie(${movie.id})">
                            <label for="movie-${movie.id}" class="w-10 h-10 flex items-center justify-center bg-gray-700 border border-gray-600 rounded-full cursor-pointer transition">
                                ✔
                            </label>
                        </div>
                    </div>
                `;
            });
        }

        // Ações de Episódio e Filmes
        function toggleSection(id) {
            const content = document.getElementById(`content-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.textContent = '▲';
            } else {
                content.classList.add('hidden');
                icon.textContent = '▼';
            }
        }

        function toggleEp(ep, sagaId) {
            const checkbox = document.getElementById(`ep-${ep}`);
            if (checkbox.checked) {
                watchedEpisodes[ep] = true;
            } else {
                delete watchedEpisodes[ep];
            }
            salvarDadosLocais();
            
            const saga = sagas.find(s => s.id === sagaId);
            let watched = 0;
            for (let i = saga.start; i <= saga.end; i++) {
                if (watchedEpisodes[i]) watched++;
            }
            
            if (watched === (saga.end - saga.start + 1) && checkbox.checked) {
                dispararCelebracao(saga);
            }
            setTimeout(renderSagas, 100); 
        }

        function toggleMovie(movieId) {
            const checkbox = document.getElementById(`movie-${movieId}`);
            if (checkbox.checked) {
                watchedMovies[movieId] = true;
            } else {
                delete watchedMovies[movieId];
            }
            salvarDadosLocais();
            renderMovies();
        }

        function marcarSaga(sagaId) {
            const saga = sagas.find(s => s.id === sagaId);
            for (let i = saga.start; i <= saga.end; i++) {
                watchedEpisodes[i] = true;
            }
            salvarDadosLocais();
            renderSagas();
            dispararCelebracao(saga);
        }

        // Celebração e Foco
        function dispararCelebracao(saga) {
            const popup = document.getElementById('celebration-popup');
            document.getElementById('celeb-img').src = saga.img;
            document.getElementById('celeb-text').textContent = `Você dominou a ${saga.name}!`;
            
            popup.classList.remove('hidden');
            setTimeout(() => popup.classList.remove('opacity-0'), 50);
        }

        function fecharCelebracao() {
            const popup = document.getElementById('celebration-popup');
            popup.classList.add('opacity-0');
            setTimeout(() => popup.classList.add('hidden'), 500);
        }

        function irParaAtual() {
            let lastWatched = 0;
            for (let i = 1; i <= 1180; i++) {
                if (watchedEpisodes[i] && !fillers.includes(i)) lastWatched = i;
            }
            let nextEp = lastWatched + 1;
            
            while (fillers.includes(nextEp)) {
                nextEp++;
            }

            const element = document.getElementById(`ep-${nextEp}`);
            if (element) {
                const sagaContainer = element.closest('.grid');
                if(sagaContainer.classList.contains('hidden')) {
                    sagaContainer.classList.remove('hidden');
                }
                element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                const label = element.nextElementSibling;
                label.classList.add('ring-4', 'ring-yellow-400', 'scale-110');
                setTimeout(() => label.classList.remove('ring-4', 'ring-yellow-400', 'scale-110'), 2000);
            }
        }

        // Exportação / Importação de Dados
        function salvarDadosLocais() {
            localStorage.setItem('opTrackerData', JSON.stringify(watchedEpisodes));
            localStorage.setItem('opTrackerMovies', JSON.stringify(watchedMovies));
        }

        function carregarPerfil() {
            const nome = localStorage.getItem('opTrackerProfile') || '';
            document.getElementById('profile-name-desktop').value = nome;
            document.getElementById('profile-name-mobile').value = nome;
        }

        function exportarDados() {
            const data = {
                episodes: watchedEpisodes,
                movies: watchedMovies,
                profile: localStorage.getItem('opTrackerProfile') || ''
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "bando_onepiece_backup.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
            document.getElementById('mobile-menu').classList.add('hidden');
        }

        function importarDados(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        if (importedData.episodes) {
                            // Novo formato (inclui filmes e perfil)
                            watchedEpisodes = importedData.episodes || {};
                            watchedMovies = importedData.movies || {};
                            if (importedData.profile) salvarPerfil(importedData.profile);
                        } else {
                            // Formato antigo (apenas episódios)
                            watchedEpisodes = importedData;
                        }
                        salvarDadosLocais();
                        renderSagas();
                        renderMovies();
                        alert('Dados do bando importados com sucesso!');
                    } catch (err) {
                        alert('Erro ao ler o arquivo. Certifique-se de que é um JSON válido.');
                    }
                    document.getElementById('mobile-menu').classList.add('hidden');
                };
                reader.readAsText(file);
            }
        }

        // Inicialização
        sortearBanner();
        carregarPerfil();
        renderSagas();
        renderMovies();
    </script>
</body>
</html>
