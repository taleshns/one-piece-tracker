<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .saga-bg { background-size: cover; background-position: center; background-blend-mode: multiply; }
        .ep-checkbox:checked + label { background-color: #ef4444; color: white; border-color: #ef4444; }
        /* Oculta scrollbar mas permite scroll */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans pb-20">

    <!-- Vídeo de Introdução -->
    <div id="intro-video-container" class="fixed inset-0 z-50 bg-black flex items-center justify-center">
        <video id="intro-video" class="w-full h-full object-cover" autoplay playsinline muted>
            <source src="abertura.mp4" type="video/mp4">
        </video>
        <button onclick="fecharIntro()" class="absolute top-6 right-6 bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-bold z-50 transition">Pular Intro</button>
    </div>

    <!-- Pop-up de Celebração -->
    <div id="celebration-popup" class="fixed inset-0 z-40 bg-black/90 hidden flex-col items-center justify-center transition-opacity duration-500 opacity-0">
        <img id="celeb-img" src="" class="w-64 h-32 object-cover rounded-lg border-4 border-yellow-500 mb-4 shadow-[0_0_20px_rgba(234,179,8,0.5)]">
        <h2 class="text-4xl font-black text-yellow-400 uppercase tracking-widest text-center">Saga Concluída!</h2>
        <p id="celeb-text" class="text-xl text-gray-300 mt-2 mb-6"></p>
        <button onclick="fecharCelebracao()" class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 px-8 py-3 rounded-full font-bold text-lg transition">Avançar</button>
    </div>

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 sticky top-0 z-30 shadow-lg">
        <div class="max-w-4xl mx-auto p-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-black text-red-500 tracking-wider uppercase">☠️ OP Tracker</h1>
            
            <div class="flex items-center gap-2">
                <input type="text" id="profile-name" placeholder="Nome do Pirata" class="bg-gray-700 border border-gray-600 rounded px-3 py-1 text-sm focus:outline-none focus:border-red-500" onchange="salvarPerfil()">
                <button onclick="exportarDados()" class="bg-gray-700 hover:bg-gray-600 text-xs px-3 py-1 rounded transition">Exportar</button>
                <label class="bg-gray-700 hover:bg-gray-600 text-xs px-3 py-1 rounded cursor-pointer transition">
                    Importar <input type="file" id="import-file" class="hidden" accept=".json" onchange="importarDados(event)">
                </label>
            </div>
        </div>
    </header>

    <!-- Container Principal -->
    <main class="max-w-4xl mx-auto p-4" id="sagas-container"></main>

    <!-- Botão Flutuante -->
    <button onclick="irParaAtual()" class="fixed bottom-6 right-6 bg-red-600 hover:bg-red-700 text-white p-4 rounded-full shadow-lg shadow-red-900/50 font-bold z-30 transition flex items-center justify-center group">
        <span class="hidden group-hover:inline mr-2">Ep. Atual</span> ⚓
    </button>

    <script>
        // Mapeamento Rigoroso das Sagas (Imagens locais via ZIP fornecido)
        const sagas = [
            { id: "eastblue", name: "Saga East Blue", img: "one-piece_East_Blue_01.webp", start: 1, end: 53, skip: [] },
            { id: "alabasta", name: "Saga Alabasta", img: "one-piece_Alabasta.webp", start: 62, end: 130, skip: [98, 99, 102] },
            { id: "skypiea", name: "Saga Skypiea", img: "one-piece_Skypiea_01.webp", start: 144, end: 195, skip: [] },
            { id: "water7", name: "Saga Water 7", img: "one-piece_Water_7_01.webp", start: 207, end: 325, skip: [220, 221, 222, 223, 224] },
            { id: "thrillerbark", name: "Saga Thriller Bark", img: "one-piece_Thriller_Bark_01.webp", start: 337, end: 381, skip: [] },
            { id: "marineford", name: "Saga Guerra de Marineford", img: "one-piece_Marineford_01.webp", start: 385, end: 516, skip: [406, 407, 426, 427, 428, 429, 457, 458, 492] },
            { id: "fishman", name: "Saga Ilha dos Homens-Peixe", img: "one-piece_Ilha_dos_Tritoes.webp", start: 517, end: 574, skip: [542] },
            { id: "dressrosa", name: "Saga Dressrosa", img: "one-piece_Dressrosa_01.webp", start: 579, end: 746, skip: [590] },
            { id: "yonkou", name: "Saga Yonkou", img: "one-piece_Saga_dos_Yonkou_01.webp", start: 751, end: 1085, skip: [780, 781, 782, 895, 896, 907, 1029, 1030] },
            { id: "final", name: "Saga Final", img: "one-piece_Saga_Final.webp", start: 1086, end: 1180, skip: [] }
        ];

        let watchedEpisodes = JSON.parse(localStorage.getItem('opTrackerData')) || {};

        // Sistema de Vídeo
        function fecharIntro() {
            const introContainer = document.getElementById('intro-video-container');
            const introVideo = document.getElementById('intro-video');
            introVideo.pause();
            introContainer.style.opacity = '0';
            setTimeout(() => introContainer.style.display = 'none', 500);
        }
        document.getElementById('intro-video').addEventListener('ended', fecharIntro);
        // Fallback de segurança para não travar a tela se o vídeo falhar
        document.getElementById('intro-video').addEventListener('error', fecharIntro);

        // Renderização Dinâmica
        function renderSagas() {
            const container = document.getElementById('sagas-container');
            container.innerHTML = '';

            sagas.forEach((saga) => {
                // Cálculo de episódios
                let epsHTML = '';
                let totalSaga = 0;
                let watchedSaga = 0;

                for (let i = saga.start; i <= saga.end; i++) {
                    if (saga.skip.includes(i)) continue;
                    totalSaga++;
                    const isChecked = watchedEpisodes[i] ? 'checked' : '';
                    if (isChecked) watchedSaga++;

                    epsHTML += `
                        <div class="relative">
                            <input type="checkbox" id="ep-${i}" class="ep-checkbox hidden" ${isChecked} onchange="toggleEp(${i}, '${saga.id}')">
                            <label for="ep-${i}" class="block text-center border border-gray-600 bg-gray-800 rounded py-2 text-sm font-medium cursor-pointer hover:border-gray-400 transition select-none">
                                ${i}
                            </label>
                        </div>
                    `;
                }

                const isCompleted = totalSaga === watchedSaga && totalSaga > 0;
                
                const sagaCard = document.createElement('div');
                sagaCard.className = 'mb-6 bg-gray-800 rounded-xl overflow-hidden shadow-md border border-gray-700';
                sagaCard.innerHTML = `
                    <div class="saga-bg h-32 relative cursor-pointer group bg-gray-700" style="background-image: url('${saga.img}');" onclick="toggleSection('${saga.id}')">
                        <div class="absolute inset-0 bg-black/60 group-hover:bg-black/40 transition"></div>
                        <div class="absolute inset-0 flex flex-col justify-center px-6">
                            <h2 class="text-2xl font-bold text-white uppercase tracking-wide drop-shadow-md">${saga.name}</h2>
                            <div class="flex items-center gap-4 mt-2">
                                <span class="text-sm font-semibold bg-black/50 px-2 py-1 rounded text-gray-200" id="progress-text-${saga.id}">
                                    ${watchedSaga} / ${totalSaga} EPs
                                </span>
                                ${isCompleted ? '<span class="text-yellow-400 text-sm font-bold bg-black/50 px-2 py-1 rounded">🏆 Concluída</span>' : ''}
                            </div>
                        </div>
                        <div class="absolute right-6 top-1/2 -translate-y-1/2 text-white/50 text-2xl transition-transform" id="icon-${saga.id}">
                            ${isCompleted ? '▼' : '▲'}
                        </div>
                    </div>
                    <div id="content-${saga.id}" class="${isCompleted ? 'hidden' : 'grid'} grid-cols-5 sm:grid-cols-8 md:grid-cols-10 gap-2 p-4 bg-gray-900/50">
                        ${epsHTML}
                    </div>
                `;
                container.appendChild(sagaCard);
            });

            document.getElementById('profile-name').value = localStorage.getItem('opTrackerProfile') || '';
        }

        // Lógica de Interação
        function toggleSection(id) {
            const content = document.getElementById(`content-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.textContent = '▲';
            } else {
                content.classList.add('hidden');
                icon.textContent = '▼';
            }
        }

        function toggleEp(ep, sagaId) {
            const checkbox = document.getElementById(`ep-${ep}`);
            if (checkbox.checked) {
                watchedEpisodes[ep] = true;
            } else {
                delete watchedEpisodes[ep];
            }
            salvarDados();
            
            // Re-render rápido apenas da barra de progresso (otimização)
            const saga = sagas.find(s => s.id === sagaId);
            let total = 0, watched = 0;
            for (let i = saga.start; i <= saga.end; i++) {
                if (!saga.skip.includes(i)) {
                    total++;
                    if (watchedEpisodes[i]) watched++;
                }
            }
            
            if (watched === total && checkbox.checked) {
                dispararCelebracao(saga);
            }
            
            // Re-render completo para atualizar UI
            setTimeout(renderSagas, 100); 
        }

        // Celebração
        function dispararCelebracao(saga) {
            const popup = document.getElementById('celebration-popup');
            document.getElementById('celeb-img').src = saga.img;
            document.getElementById('celeb-text').textContent = `Você superou a ${saga.name}!`;
            
            popup.classList.remove('hidden');
            // Pequeno delay para a transição do Tailwind funcionar
            setTimeout(() => popup.classList.remove('opacity-0'), 50);
        }

        function fecharCelebracao() {
            const popup = document.getElementById('celebration-popup');
            popup.classList.add('opacity-0');
            setTimeout(() => popup.classList.add('hidden'), 500);
        }

        // Navegação e Dados
        function irParaAtual() {
            let lastWatched = 0;
            for (let i = 1; i <= 1180; i++) {
                if (watchedEpisodes[i]) lastWatched = i;
            }
            let nextEp = lastWatched + 1;
            
            // Pula fillers
            sagas.forEach(saga => {
                if (saga.skip.includes(nextEp)) {
                    while (saga.skip.includes(nextEp)) nextEp++;
                }
            });

            const element = document.getElementById(`ep-${nextEp}`);
            if (element) {
                // Se a saga estiver fechada, abre
                const sagaContainer = element.closest('.grid');
                if(sagaContainer.classList.contains('hidden')) {
                    sagaContainer.classList.remove('hidden');
                }
                
                element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                // Efeito visual no episódio
                const label = element.nextElementSibling;
                label.classList.add('ring-4', 'ring-yellow-400', 'scale-110');
                setTimeout(() => label.classList.remove('ring-4', 'ring-yellow-400', 'scale-110'), 2000);
            }
        }

        function salvarPerfil() {
            localStorage.setItem('opTrackerProfile', document.getElementById('profile-name').value);
        }

        function salvarDados() {
            localStorage.setItem('opTrackerData', JSON.stringify(watchedEpisodes));
        }

        function exportarDados() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(watchedEpisodes));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "bando_onepiece_backup.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importarDados(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        watchedEpisodes = JSON.parse(e.target.result);
                        salvarDados();
                        renderSagas();
                        alert('Dados do bando importados com sucesso!');
                    } catch (err) {
                        alert('Erro ao ler o arquivo. Certifique-se de que é um JSON válido.');
                    }
                };
                reader.readAsText(file);
            }
        }

        // Inicia
        renderSagas();
    </script>
</body>
</html>
