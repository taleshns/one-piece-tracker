<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece Tracker</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Acompanhe episódios canônicos, fillers e filmes de One Piece.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OP Tracker">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .ep-btn {
            display: flex; align-items: center; justify-content: center;
            height: 40px; border-radius: 8px; font-weight: 600; font-size: 0.875rem;
            transition: all 0.2s ease; cursor: pointer; user-select: none;
            border: 1px solid transparent;
        }

        .ep-canonical { background-color: #1e293b; border-color: #334155; color: #cbd5e1; }
        .ep-canonical:hover { background-color: #334155; transform: translateY(-2px); }

        .ep-filler { background-color: #422006; border-color: #713f12; color: #facc15; }
        .ep-filler:hover { background-color: #713f12; color: #fef08a; transform: translateY(-2px); }

        .ep-watched {
            background-color: #e11d48 !important;
            border-color: #be123c !important;
            color: #ffffff !important;
            box-shadow: 0 4px 6px -1px rgba(225, 29, 72, 0.3);
        }
        .ep-watched:hover { background-color: #be123c !important; transform: translateY(-2px); }

        /* Oculta fillers instantaneamente sem reconstruir a grade */
        .hide-fillers .ep-is-filler { display: none !important; }

        .highlight-ep { animation: pulse-ring 1.4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse-ring {
            0%, 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.9); }
            50% { box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); }
        }

        .highlight-saga { animation: saga-flash 1.8s ease; }
        @keyframes saga-flash {
            0%, 100% { border-color: #334155; }
            30% { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.35); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-slate-900/85 backdrop-blur-md border-b border-slate-800 shadow-sm">
        <div class="max-w-6xl mx-auto p-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500 tracking-tight">
                OP TRACKER
            </h1>

            <button type="button" onclick="toggleMenu()" class="text-slate-300 hover:text-white md:hidden transition" aria-label="Abrir menu">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>

            <nav class="hidden md:flex items-center gap-5">
                <button type="button" onclick="switchTab('eps')" id="nav-eps" class="text-sm font-semibold text-white transition">Episódios</button>
                <button type="button" onclick="switchTab('movies')" id="nav-movies" class="text-sm font-semibold text-slate-400 hover:text-white transition">Filmes</button>
                <button type="button" onclick="abrirModalCartaz()" class="text-sm font-semibold text-amber-400 hover:text-amber-300 transition">Cartaz</button>
                <button type="button" onclick="exportarDados()" class="text-sm font-semibold text-slate-400 hover:text-white transition">Exportar</button>
                <label class="text-sm font-semibold text-slate-400 hover:text-white cursor-pointer transition">
                    Importar <input type="file" class="hidden" accept=".json" onchange="importarDados(event)">
                </label>
                <input type="text" id="profile-name-desktop" placeholder="Seu Nome Pirata" class="bg-slate-800 border border-slate-700 rounded-full px-4 py-1.5 text-sm text-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition w-44" oninput="salvarPerfil(this.value)">
            </nav>
        </div>

        <!-- Menu Mobile -->
        <nav id="mobile-menu" class="hidden bg-slate-900 border-t border-slate-800 md:hidden flex-col p-4 gap-4 shadow-xl absolute w-full left-0">
            <button type="button" onclick="switchTab('eps')" class="text-left text-slate-200 font-semibold hover:text-white">Episódios</button>
            <button type="button" onclick="switchTab('movies')" class="text-left text-slate-200 font-semibold hover:text-white">Filmes</button>
            <button type="button" onclick="abrirModalCartaz()" class="text-left text-amber-400 font-semibold hover:text-amber-300
