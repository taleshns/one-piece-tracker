<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        
        /* Scrollbar Moderna */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Estilos de Episódios */
        .ep-btn {
            display: flex; align-items: center; justify-content: center;
            height: 40px; border-radius: 8px; font-weight: 600; font-size: 0.875rem;
            transition: all 0.2s ease; cursor: pointer; user-select: none;
            border: 1px solid transparent;
        }
        
        /* Canônico Não Visto */
        .ep-canonical { background-color: #1e293b; border-color: #334155; color: #cbd5e1; }
        .ep-canonical:hover { background-color: #334155; transform: translateY(-2px); }
        
        /* Filler Não Visto */
        .ep-filler { background-color: #422006; border-color: #713f12; color: #facc15; }
        .ep-filler:hover { background-color: #713f12; color: #fef08a; transform: translateY(-2px); }
        
        /* Episódio Visto (Serve para Filler e Canônico) */
        .ep-watched { background-color: #e11d48 !important; border-color: #be123c !important; color: white !important; box-shadow: 0 4px 6px -1px rgba(225, 29, 72, 0.3); }
        .ep-watched:hover { background-color: #be123c !important; transform: translateY(-2px); }

        /* Animação Ep Atual */
        .highlight-ep { animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse-ring {
            0%, 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); }
        }
    </style>
</head>
<body class="pb-24">

    <!-- Header Glassmorphism -->
    <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 shadow-sm">
        <div class="max-w-6xl mx-auto p-4 flex justify-between items-center">
            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500 tracking-tight">
                OP TRACKER
            </h1>
            
            <button onclick="toggleMenu()" class="text-slate-300 hover:text-white md:hidden transition">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>

            <nav class="hidden md:flex items-center gap-6">
                <button onclick="switchTab('eps')" class="text-sm font-semibold text-slate-300 hover:text-white transition">Episódios</button>
                <button onclick="switchTab('movies')" class="text-sm font-semibold text-slate-300 hover:text-white transition">Filmes</button>
                <button onclick="exportarDados()" class="text-sm font-semibold text-slate-300 hover:text-white transition">Exportar</button>
                <label class="text-sm font-semibold text-slate-300 hover:text-white cursor-pointer transition">
                    Importar <input type="file" class="hidden" accept=".json" onchange="importarDados(event)">
                </label>
                <input type="text" id="profile-name-desktop" placeholder="Seu Nome Pirata" class="bg-slate-800 border border-slate-700 rounded-full px-4 py-1.5 text-sm text-white focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition" oninput="salvarPerfil(this.value)">
            </nav>
        </div>
        
        <!-- Mobile Menu -->
        <nav id="mobile-menu" class="hidden bg-slate-900 border-t border-slate-800 md:hidden flex-col p-4 gap-4 shadow-xl absolute w-full">
            <button onclick="switchTab('eps')" class="text-left text-slate-300 font-semibold hover:text-white">Episódios</button>
            <button onclick="switchTab('movies')" class="text-left text-slate-300 font-semibold hover:text-white">Filmes</button>
            <button onclick="exportarDados()" class="text-left text-slate-300 font-semibold hover:text-white">Exportar Backup</button>
            <label class="text-left text-slate-300 font-semibold cursor-pointer hover:text-white">
                Importar Backup <input type="file" class="hidden" accept=".json" onchange="importarDados(event)">
            </label>
            <input type="text" id="profile-name-mobile" placeholder="Seu Nome Pirata" class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-red-500" oninput="salvarPerfil(this.value)">
        </nav>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-6 mt-4">
        
        <!-- Banner Carrossel do Topo (Clean) -->
        <div class="mb-10 rounded-2xl overflow-hidden shadow-2xl border border-slate-800 h-48 sm:h-72 md:h-96 relative group">
            <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent z-10"></div>
            <img id="top-banner" src="" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
            <div class="absolute bottom-6 left-6 z-20">
                <p class="text-slate-300 text-sm font-semibold tracking-wider mb-1">ACOMPANHE SUA JORNADA</p>
                <h2 class="text-3xl md:text-5xl font-black text-white">Rumo ao One Piece</h2>
            </div>
        </div>

        <!-- Aba de Episódios -->
        <div id="eps-view">
            <!-- Legenda -->
            <div class="flex flex-wrap gap-6 mb-8 text-xs md:text-sm font-semibold text-slate-400 bg-slate-800/50 p-4 rounded-xl border border-slate-800">
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-slate-700"></span> Canônico</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-yellow-500"></span> Filler (Pode pular)</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-rose-600"></span> Assistido</div>
            </div>
            
            <div id="sagas-container" class="space-y-8"></div>
        </div>

        <!-- Aba de Filmes -->
        <div id="movies-view" class="hidden">
            <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500 uppercase tracking-wide mb-8">Filmes Canônicos & Especiais</h2>
            <div id="movies-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

    </main>

    <!-- Botão Flutuante Ep Atual -->
    <button id="btn-atual" onclick="irParaAtual()" class="fixed bottom-8 right-8 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white p-4 rounded-full shadow-[0_0_20px_rgba(225,29,72,0.4)] font-bold z-30 transition-all hover:scale-110 flex items-center justify-center group">
        <svg class="w-6 h-6 mr-0 md:mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span class="hidden md:inline">Ep. Atual</span>
    </button>

    <script>
        // Utilizando imagens comprovadas que existem no seu pacote ZIP para o carrossel funcionar
        const carouselImages = [
            "one-piece_Saga_dos_Yonkou_01.webp",
            "one-piece_Saga_Final.webp",
            "one-piece_Marineford_01.webp",
            "one-piece_Water_7_01.webp"
        ];
        
        const sagas = [
            { id: "eastblue", name: "Saga East Blue", img: "one-piece_East_Blue_01.webp", start: 1, end: 61 },
            { id: "alabasta", name: "Saga Alabasta", img: "one-piece_Alabasta.webp", start: 62, end: 143 },
            { id: "skypiea", name: "Saga Skypiea", img: "one-piece_Skypiea_01.webp", start: 144, end: 206 },
            { id: "water7", name: "Saga Water 7", img: "one-piece_Water_7_01.webp", start: 207, end: 325 },
            { id: "thrillerbark", name: "Saga Thriller Bark", img: "one-piece_Thriller_Bark_01.webp", start: 326, end: 384 },
            { id: "marineford", name: "Guerra de Marineford", img: "one-piece_Marineford_01.webp", start: 385, end: 516 },
            { id: "fishman", name: "Ilha dos Homens-Peixe", img: "one-piece_Ilha_dos_Tritoes.webp", start: 517, end: 574 },
            { id: "dressrosa", name: "Saga Dressrosa", img: "one-piece_Dressrosa_01.webp", start: 575, end: 746 },
            { id: "yonkou", name: "Saga dos Yonkou", img: "one-piece_Saga_dos_Yonkou_01.webp", start: 747, end: 1085 },
            { id: "final", name: "Saga Final (Egghead)", img: "one-piece_Saga_Final.webp", start: 1086, end: 1180 }
        ];

        const fillers = [
            50, 54, 55, 56, 57, 58, 59, 60, 61, 93, 98, 99, 101, 102, 131, 132, 133, 134, 135, 136, 137, 138, 139, 
            140, 141, 142, 143, 196, 197, 198, 199, 200, 201, 202, 203, 204, 205, 206, 213, 214, 215, 216, 220, 
            221, 222, 223, 224, 225, 226, 279, 280, 281, 282, 283, 291, 292, 303, 317, 318, 319, 326, 327, 328, 
            329, 330, 331, 332, 333, 334, 335, 336, 382, 383, 384, 406, 407, 426, 427, 428, 429, 457, 458, 492, 
            499, 506, 542, 575, 576, 577, 578, 590, 747, 748, 749, 750, 775, 780, 781, 782, 895, 896, 907, 1029, 1030
        ];

        const movies = [
            { id: 1, title: "O Filme", year: 2000 },
            { id: 2, title: "Aventura na Ilha Neerlandesa", year: 2001 },
            { id: 3, title: "O Reino de Chopper", year: 2002 },
            { id: 4, title: "Aventura Mortal", year: 2003 },
            { id: 5, title: "A Maldição da Espada Sagrada", year: 2004 },
            { id: 6, title: "Barão Omatsuri e a Ilha Secreta", year: 2005 },
            { id: 7, title: "O Soldado Mecânico Gigante", year: 2006 },
            { id: 8, title: "Princesa do Deserto e os Piratas", year: 2007 },
            { id: 9, title: "Flor de Inverno, Milagre da Cerejeira", year: 2008 },
            { id: 10, title: "Strong World", year: 2009 },
            { id: 11, title: "A Perseguição ao Chapéu de Palha (3D)", year: 2011 },
            { id: 12, title: "Z", year: 2012 },
            { id: 13, title: "Gold", year: 2016 },
            { id: 14, title: "Stampede", year: 2019 },
            { id: 15, title: "Red", year: 2022 }
        ];

        let watchedEpisodes = JSON.parse(localStorage.getItem('opTrackerData')) || {};
        let watchedMovies = JSON.parse(localStorage.getItem('opTrackerMovies')) || {};

        function sortearBanner() {
            const randomImg = carouselImages[Math.floor(Math.random() * carouselImages.length)];
            document.getElementById('top-banner').src = randomImg;
        }

        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        function switchTab(tab) {
            document.getElementById('eps-view').classList.add('hidden');
            document.getElementById('movies-view').classList.add('hidden');
            document.getElementById(`${tab}-view`).classList.remove('hidden');
            document.getElementById('btn-atual').style.display = tab === 'eps' ? 'flex' : 'none';
            document.getElementById('mobile-menu').classList.add('hidden');
        }

        function salvarPerfil(valor) {
            localStorage.setItem('opTrackerProfile', valor);
            document.getElementById('profile-name-desktop').value = valor;
            document.getElementById('profile-name-mobile').value = valor;
        }

        function carregarPerfil() {
            const nome = localStorage.getItem('opTrackerProfile') || '';
            document.getElementById('profile-name-desktop').value = nome;
            document.getElementById('profile-name-mobile').value = nome;
        }

        // Renderização que roda apenas uma vez para não quebrar o layout
        function renderSagas() {
            const container = document.getElementById('sagas-container');
            container.innerHTML = '';

            sagas.forEach((saga) => {
                let epsHTML = '';
                let totalSaga = 0;
                let watchedSaga = 0;

                for (let i = saga.start; i <= saga.end; i++) {
                    totalSaga++;
                    const isWatched = watchedEpisodes[i];
                    if (isWatched) watchedSaga++;
                    
                    const isFiller = fillers.includes(i);
                    let btnClass = 'ep-btn ';
                    
                    if (isWatched) {
                        btnClass += 'ep-watched';
                    } else if (isFiller) {
                        btnClass += 'ep-filler';
                    } else {
                        btnClass += 'ep-canonical';
                    }

                    epsHTML += `<button id="ep-${i}" data-saga="${saga.id}" data-filler="${isFiller}" onclick="toggleEp(${i}, '${saga.id}')" class="${btnClass}">${i}</button>`;
                }

                const isCompleted = totalSaga === watchedSaga && totalSaga > 0;
                
                const sagaCard = document.createElement('div');
                sagaCard.className = 'bg-slate-800/80 rounded-2xl overflow-hidden border border-slate-700 shadow-xl';
                
                sagaCard.innerHTML = `
                    <div class="p-5 md:p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 class="text-2xl md:text-3xl font-black text-white tracking-tight">${saga.name}</h2>
                            <div class="flex flex-wrap items-center gap-3 mt-2">
                                <span class="text-sm font-bold bg-slate-900 px-3 py-1 rounded-full text-slate-300 shadow-inner" id="progress-text-${saga.id}">
                                    ${watchedSaga} / ${totalSaga} EPs
                                </span>
                                <span id="badge-${saga.id}" class="${isCompleted ? 'inline-block' : 'hidden'} text-xs font-bold bg-gradient-to-r from-yellow-400 to-amber-600 px-3 py-1 rounded-full text-white shadow-lg">🏆 Concluída</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 w-full md:w-auto mt-4 md:mt-0">
                            <button onclick="marcarSaga('${saga.id}')" class="flex-1 md:flex-none bg-slate-700 hover:bg-slate-600 text-white px-5 py-2.5 rounded-lg text-sm font-bold transition shadow">Marcar Tudo</button>
                            <button onclick="toggleSection('${saga.id}')" class="bg-slate-900 hover:bg-black px-4 py-2.5 rounded-lg transition text-slate-300 border border-slate-700" id="icon-${saga.id}">
                                ${isCompleted ? 'Ver Episódios' : 'Ocultar'}
                            </button>
                        </div>
                    </div>
                    
                    <div id="content-${saga.id}" class="${isCompleted ? 'hidden' : 'block'} border-t border-slate-700">
                        <img src="${saga.img}" class="w-full h-32 md:h-48 object-cover">
                        <div class="grid grid-cols-5 sm:grid-cols-8 md:grid-cols-10 lg:grid-cols-12 gap-2 p-5 bg-slate-900/50">
                            ${epsHTML}
                        </div>
                    </div>
                `;
                container.appendChild(sagaCard);
            });
        }

        // Nova lógica de Toggle (Atualiza apenas o botão clicado, sem recarregar a tela toda)
        function toggleEp(ep, sagaId) {
            const btn = document.getElementById(`ep-${ep}`);
            const isFiller = btn.getAttribute('data-filler') === 'true';
            
            if (watchedEpisodes[ep]) {
                delete watchedEpisodes[ep];
                btn.classList.remove('ep-watched');
                btn.classList.add(isFiller ? 'ep-filler' : 'ep-canonical');
            } else {
                watchedEpisodes[ep] = true;
                btn.classList.remove('ep-canonical', 'ep-filler');
                btn.classList.add('ep-watched');
            }
            
            salvarDadosLocais();
            atualizarProgressoSaga(sagaId);
        }

        function atualizarProgressoSaga(sagaId) {
            const saga = sagas.find(s => s.id === sagaId);
            let total = 0, watched = 0;
            
            for (let i = saga.start; i <= saga.end; i++) {
                total++;
                if (watchedEpisodes[i]) watched++;
            }
            
            document.getElementById(`progress-text-${sagaId}`).textContent = `${watched} / ${total} EPs`;
            
            const badge = document.getElementById(`badge-${sagaId}`);
            if (watched === total && total > 0) {
                badge.classList.remove('hidden');
                badge.classList.add('inline-block');
            } else {
                badge.classList.remove('inline-block');
                badge.classList.add('hidden');
            }
        }

        function marcarSaga(sagaId) {
            const saga = sagas.find(s => s.id === sagaId);
            for (let i = saga.start; i <= saga.end; i++) {
                watchedEpisodes[i] = true;
                const btn = document.getElementById(`ep-${i}`);
                if(btn) {
                    btn.classList.remove('ep-canonical', 'ep-filler');
                    btn.classList.add('ep-watched');
                }
            }
            salvarDadosLocais();
            atualizarProgressoSaga(sagaId);
        }

        function toggleSection(id) {
            const content = document.getElementById(`content-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                icon.textContent = 'Ocultar';
            } else {
                content.classList.add('hidden');
                icon.textContent = 'Ver Episódios';
            }
        }

        // Foco no Episódio Atual
        function irParaAtual() {
            let lastWatched = 0;
            for (let i = 1; i <= 1180; i++) {
                if (watchedEpisodes[i] && !fillers.includes(i)) lastWatched = i;
            }
            
            let nextEp = lastWatched + 1;
            while (fillers.includes(nextEp)) { nextEp++; }

            const element = document.getElementById(`ep-${nextEp}`);
            if (element) {
                const sagaId = element.getAttribute('data-saga');
                const content = document.getElementById(`content-${sagaId}`);
                
                if (content.classList.contains('hidden')) {
                    toggleSection(sagaId);
                }
                
                setTimeout(() => {
                    element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    element.classList.add('highlight-ep', 'scale-110');
                    setTimeout(() => element.classList.remove('highlight-ep', 'scale-110'), 2500);
                }, 150);
            } else {
                alert("Você está em dia com os episódios canônicos!");
            }
        }

        // Renderizar Filmes
        function renderMovies() {
            const container = document.getElementById('movies-container');
            container.innerHTML = '';

            movies.forEach(movie => {
                const isWatched = watchedMovies[movie.id];
                const bgClass = isWatched ? 'bg-rose-900/30 border-rose-500' : 'bg-slate-800/80 border-slate-700';
                const textClass = isWatched ? 'text-rose-400' : 'text-slate-400';
                const checkClass = isWatched ? 'bg-rose-600 border-rose-600 text-white' : 'bg-slate-900 border-slate-600 text-transparent';

                container.innerHTML += `
                    <div id="movie-card-${movie.id}" class="rounded-xl p-5 flex items-center justify-between shadow-lg border transition duration-300 ${bgClass}">
                        <div class="pr-4">
                            <p class="text-xs font-black tracking-widest uppercase mb-1 ${textClass}">Filme ${movie.id} • ${movie.year}</p>
                            <h3 class="text-lg font-bold text-white leading-tight">${movie.title}</h3>
                        </div>
                        <button onclick="toggleMovie(${movie.id})" id="movie-btn-${movie.id}" class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-full border-2 transition duration-200 ${checkClass}">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </button>
                    </div>
                `;
            });
        }

        function toggleMovie(movieId) {
            if (watchedMovies[movieId]) {
                delete watchedMovies[movieId];
            } else {
                watchedMovies[movieId] = true;
            }
            salvarDadosLocais();
            renderMovies(); // Filmes são leves, podemos dar re-render sem problemas de grid
        }

        // Exportação / Importação Modernizadas e Seguras
        function salvarDadosLocais() {
            localStorage.setItem('opTrackerData', JSON.stringify(watchedEpisodes));
            localStorage.setItem('opTrackerMovies', JSON.stringify(watchedMovies));
        }

        function exportarDados() {
            const data = {
                episodes: watchedEpisodes,
                movies: watchedMovies,
                profile: localStorage.getItem('opTrackerProfile') || ''
            };
            
            // Usando Blob para evitar bloqueios de URL longas em navegadores modernos
            const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = "op_tracker_backup.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            document.getElementById('mobile-menu').classList.add('hidden');
        }

        function importarDados(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        if (importedData.episodes) {
                            watchedEpisodes = importedData.episodes || {};
                            watchedMovies = importedData.movies || {};
                            if (importedData.profile) salvarPerfil(importedData.profile);
                        } else {
                            watchedEpisodes = importedData;
                        }
                        salvarDadosLocais();
                        renderSagas();
                        renderMovies();
                        alert('Backup importado com sucesso, Capitão!');
                    } catch (err) {
                        alert('Erro ao ler o arquivo. Tem certeza que é o backup correto?');
                    }
                    document.getElementById('mobile-menu').classList.add('hidden');
                };
                reader.readAsText(file);
            }
        }

        // Inicialização
        sortearBanner();
        carregarPerfil();
        renderSagas();
        renderMovies();
    </script>
</body>
</html>
